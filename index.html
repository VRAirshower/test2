<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Test01</title>

<p id="loading">ロード中</p>
<button id="start" hidden>開始</button>
<canvas id="unity-canvas" width="960" height="600" style="width:960px;height:600px" hidden></canvas>

<script>
const loading = document.querySelector("#loading");
const start = document.querySelector("#start");
const canvas = document.querySelector("#unity-canvas");
const build = "Build/Test2WebGL";
const loader = document.createElement("script");

loader.src = build + ".loader.js";
loader.onload = () => createUnityInstance(canvas, {
  dataUrl: build + ".data.unityweb",
  frameworkUrl: build + ".framework.js.unityweb",
  codeUrl: build + ".wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "Nagano",
  productVersion: "0.1"
}).then(() => {
  loading.hidden = true;
  start.hidden = false;
  start.onclick = () => {
    start.hidden = true;
    canvas.hidden = false;
  };
}).catch(() => loading.textContent = "読み込みに失敗しました");

document.body.appendChild(loader);
</script>
